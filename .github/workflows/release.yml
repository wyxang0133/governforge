name: Release Images
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  images:
    strategy:
      matrix:
        include:
          - {name: backend, dockerfile: Dockerfile.backend}
          - {name: frontend, dockerfile: Dockerfile.frontend}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: sigstore/cosign-installer@v4.1.2
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: "${{ matrix.dockerfile }}"
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/governforge-${{ matrix.name }}:${{ github.ref_name }}"
          sbom: true
          provenance: mode=max
      - name: Keyless sign immutable image digest
        env:
          IMAGE: "ghcr.io/${{ github.repository_owner }}/governforge-${{ matrix.name }}"
          DIGEST: "${{ steps.build.outputs.digest }}"
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
