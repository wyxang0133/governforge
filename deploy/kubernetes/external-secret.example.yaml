apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: governforge-secrets, namespace: governforge}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: enterprise-secrets, kind: ClusterSecretStore}
  target: {name: governforge-secrets, creationPolicy: Owner}
  dataFrom: [{extract: {key: production/governforge}}]
