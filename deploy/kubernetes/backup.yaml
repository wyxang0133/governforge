apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-backups}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: postgres-logical-backup}
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 70, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command: [sh, -ec, 'umask 077; pg_dump "$DATABASE_URL" --format=custom --file="/backups/governforge-$(date -u +%Y%m%dT%H%M%SZ).dump"; find /backups -type f -name "*.dump" -mtime +14 -delete']
              env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: governforge-secrets, key: DATABASE_URL}}}]
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: backups, mountPath: /backups}, {name: tmp, mountPath: /tmp}]
          volumes: [{name: backups, persistentVolumeClaim: {claimName: postgres-backups}}, {name: tmp, emptyDir: {sizeLimit: 64Mi}}]
