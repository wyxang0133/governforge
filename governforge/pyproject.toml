[project]
name = "governforge"
version = "1.1.0"
description = "Enterprise AI Coding governance control plane and grounded knowledge agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.11",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "PyJWT>=2.10",
  "cryptography>=44",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.28",
  "loguru>=0.7",
  "prometheus-client>=0.21",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "PyYAML>=6.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-asyncio>=0.24"]

[project.scripts]
governforge-agent-hook = "governforge.cli.agent_hook:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/governforge"]
