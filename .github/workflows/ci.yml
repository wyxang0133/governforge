name: CI
permissions:
  contents: read
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install uv
      - run: uv sync --frozen --extra dev
        working-directory: governforge
      - run: uv run pytest -q --cov=governforge --cov-report=term-missing
        working-directory: governforge
      - run: uv tool run pip-audit
        working-directory: governforge

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: governforge_test, POSTGRES_USER: governforge, POSTGRES_PASSWORD: integration-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U governforge -d governforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://governforge:integration-password@localhost:5432/governforge_test
      TEST_DATABASE_URL: postgresql+psycopg://governforge:integration-password@localhost:5432/governforge_test
      JWT_SECRET_KEY: integration-only-secret-key-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install uv
      - run: uv sync --frozen --extra dev
        working-directory: governforge
      - run: uv run alembic upgrade head
        working-directory: governforge
      - run: uv run alembic downgrade 20260717_0005 && uv run alembic upgrade head
        working-directory: governforge
      - run: uv run pytest -q
        working-directory: governforge

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: e2e-postgres-password
      JWT_SECRET_KEY: e2e-only-secret-key-at-least-32-bytes
      GITHUB_WEBHOOK_SECRET: e2e-webhook-secret
      E2E_GITHUB_WEBHOOK_SECRET: e2e-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/login
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: web/playwright-report, retention-days: 7}
      - if: always()
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, postgres-integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t governforge-backend:ci -f Dockerfile.backend .
      - run: docker build -t governforge-frontend:ci -f Dockerfile.frontend .
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "governforge-backend:ci", format: table, exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "governforge-frontend:ci", format: table, exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., scanners: "vuln,secret,misconfig", format: table, exit-code: "1", severity: "HIGH,CRITICAL"}

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize deploy/kubernetes > /tmp/governforge.yaml
      - run: kubectl apply --dry-run=client --validate=false -f /tmp/governforge.yaml

  publish-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, postgres-integration, browser-e2e, images, manifests]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        include:
          - {name: backend, dockerfile: Dockerfile.backend}
          - {name: frontend, dockerfile: Dockerfile.frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: "${{ matrix.dockerfile }}"
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/governforge-${{ matrix.name }}:${{ github.sha }}"
