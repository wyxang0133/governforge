apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: devpilot-secrets, namespace: devpilot}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: enterprise-secrets, kind: ClusterSecretStore}
  target: {name: devpilot-secrets, creationPolicy: Owner}
  dataFrom: [{extract: {key: production/devpilot}}]
