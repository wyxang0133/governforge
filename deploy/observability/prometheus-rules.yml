groups:
  - name: devpilot-slo
    rules:
      - record: devpilot:http_error_ratio_5m
        expr: sum(rate(devpilot_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(devpilot_http_requests_total[5m])), 0.001)
      - record: devpilot:http_p95_seconds_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(devpilot_http_request_duration_seconds_bucket[5m])))
      - alert: DevPilotHighErrorRate
        expr: devpilot:http_error_ratio_5m > 0.02
        for: 10m
        labels: {severity: critical, service: devpilot}
        annotations: {summary: "DevPilot 5xx error ratio is above 2%", runbook: "docs/04-部署与运维.md#告警处置"}
      - alert: DevPilotHighLatency
        expr: devpilot:http_p95_seconds_5m > 1
        for: 15m
        labels: {severity: warning, service: devpilot}
        annotations: {summary: "DevPilot API p95 latency is above 1 second"}
      - alert: DevPilotWebhookFailures
        expr: sum(increase(devpilot_webhook_events_total{status!~"processed|duplicate"}[10m])) > 5
        for: 5m
        labels: {severity: warning, service: devpilot}
        annotations: {summary: "GitHub webhook failures are accumulating"}
      - alert: DevPilotOutboxWorkerStalled
        expr: time() - devpilot_outbox_last_success_unixtime > 120
        for: 5m
        labels: {severity: critical, service: devpilot-worker}
        annotations: {summary: "Outbox worker has not completed a batch for two minutes"}
      - alert: DevPilotOutboxDeadLetters
        expr: increase(devpilot_outbox_events_total{status="failed"}[15m]) > 0
        for: 1m
        labels: {severity: critical, service: devpilot-worker}
        annotations: {summary: "Outbox event reached dead-letter state", runbook: "docs/04-部署与运维.md#告警处置"}
